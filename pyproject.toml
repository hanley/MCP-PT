[build-system]
# PEP 639 ('license' as SPDX expression + 'license-files') needs hatchling >=1.27. 
# Without the floor, an environment with an old hatchling builds a wheel 
# without a declared license and PyPI rejects it when uploading it, not when building it.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "packet-tracer-mcp"
version = "0.9.0"
description = "MCP server for Cisco Packet Tracer - topology planning, validation, auto-fix, generation, and configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "", email = "" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "cisco",
    "packet-tracer",
    "networking",
    "network-automation",
    "topology",
    "ccna",
    "ospf",
    "vlan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # mcp >=1.13 builds tool output schemas from return annotations, which requires
    # pydantic >=2.11. Pinning pydantic too low (e.g. 2.8) makes the server crash on
    # startup at the first @mcp.tool() with a PydanticUserError. Keep both in sync.
    "mcp[cli]>=1.13,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = ""
Documentation = ""
Repository = ""
Changelog = ""
Issues = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests matter 'src.packet_tracer_mcp'. Setting it here avoids depending on the 
# Implicit insertion of rootdir and ensures a single module identity. 
# In addition, a couple of tests read files by path relative to the repo, so the 
# suite should be run from the root.
pythonpath = ["."]

[project.scripts]
pt-mcp = "packet_tracer_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/packet_tracer_mcp"]

[tool.hatch.build.targets.sdist]
# The default sdist takes EVERYTHING that is not in.gitignore: the GIFs and 
# of 'demo/' PNGs are 9.7 of the 10.2 MB of the tarball, for a package whose 
# code weighs 219 KB. No one who does 'pip install' needs the banner.
exclude = [
    "demo/",
    "docs/",
    "data/",
    "mkdocs.yml",
    ".github/",
]
